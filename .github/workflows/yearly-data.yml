name: Validate yearly data seed

on:
  workflow_dispatch:
    inputs:
      seed_path:
        description: Path to one data/year-links/YYYY.json file
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - '.github/workflows/yearly-data.yml'
      - 'data/year-links/*.json'
      - 'crawler/**'
      - 'convert/**'
      - 'metadata/school-data.template.json'
  push:
    branches: [main]
    paths:
      - 'data/year-links/*.json'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    env:
      WAF_BROWSER_PATH: /usr/bin/microsoft-edge
      WAF_HEADLESS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          python -m pip install -r crawler/requirements.txt -r convert/requirements.txt
          npm ci
      - name: Ensure Xvfb is available for headed Edge
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Discover changed yearly seed files
        id: seeds
        shell: bash
        env:
          SEED_PATH: ${{ inputs.seed_path }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" -- 'data/year-links/*.json' > changed-seeds.txt
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$SEED_PATH" > changed-seeds.txt
          else
            git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'data/year-links/*.json' > changed-seeds.txt
          fi
          if [[ ! -s changed-seeds.txt ]]; then
            echo "has_seeds=false" >> "$GITHUB_OUTPUT"
            echo "No yearly seed files to validate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_seeds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import changed seeds in disposable workspaces
        id: validate
        shell: bash
        run: |
          mkdir -p yearly-ingest-reports yearly-ingest-output
          status=0
          while IFS= read -r seed; do
            [[ -n "$seed" ]] || continue
            if [[ "$seed" != data/year-links/*.json ]]; then
              echo "Unsupported seed path: $seed" >&2
              status=1
              continue
            fi
            name="$(basename "$seed" .json)"
            export_args=()
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              export_args=(--export-dir "yearly-ingest-output/${name}")
            fi
            if ! xvfb-run --auto-servernum python -m convert.ingest_year --seed "$seed" --check "${export_args[@]}" \
                2>&1 | tee "yearly-ingest-reports/${name}.log"; then
              status=1
            fi
          done < changed-seeds.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Package checked outputs for merge
        if: success() && github.event_name == 'pull_request' && steps.seeds.outputs.has_seeds == 'true'
        run: >-
          python -m convert.ingest_artifact package
          --root yearly-ingest-output
          --repository "$GITHUB_REPOSITORY"
          --pr-number "${{ github.event.pull_request.number }}"
          --pr-head-sha "${{ github.event.pull_request.head.sha }}"
          --run-id "$GITHUB_RUN_ID"
          --seeds-file changed-seeds.txt
      - name: Upload checked data for merge publisher
        if: success() && github.event_name == 'pull_request' && steps.seeds.outputs.has_seeds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yearly-ingest-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: yearly-ingest-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload manually selected data for a later PR merge
        if: success() && github.event_name == 'workflow_dispatch' && steps.seeds.outputs.has_seeds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yearly-ingest-manual-${{ github.sha }}
          path: yearly-ingest-output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload review reports
        if: always() && steps.seeds.outputs.has_seeds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yearly-ingest-review
          path: |
            yearly-ingest-reports/
            yearly-ingest-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Run application regression suite
        run: npm test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      WAF_BROWSER_PATH: /usr/bin/microsoft-edge
      WAF_HEADLESS: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: python -m pip install -r crawler/requirements.txt -r convert/requirements.txt
      - name: Discover pushed yearly seed files
        id: seeds
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- 'data/year-links/*.json' > changed-seeds.txt
          if [[ ! -s changed-seeds.txt ]]; then
            echo "No yearly seed files to publish" >> "$GITHUB_STEP_SUMMARY"
            echo "has_seeds=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_seeds=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Find checked artifact from merged pull request
        id: artifact
        if: steps.seeds.outputs.has_seeds == 'true'
        shell: bash
        run: |
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | last // empty')"
          if [[ -z "$pr_json" ]]; then
            echo "No merged pull request is associated with this push; running the selected annual ingest directly."
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          artifact_name="yearly-ingest-pr-${pr_number}-${pr_head_sha}"
          artifact_row="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
            --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | [.created_at, .workflow_run.id] | @tsv" \
            | sort | tail -n 1)"
          if [[ -z "$artifact_row" ]]; then
            echo "No successful checked artifact found; running the selected annual ingest directly."
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id="${artifact_row##*$'\t'}"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/yearly-data.yml" --jq '.id')"
          if [[ "$(jq -r '.event' <<<"$run_json")" != "pull_request" || \
                "$(jq -r '.conclusion' <<<"$run_json")" != "success" || \
                "$(jq -r '.workflow_id' <<<"$run_json")" != "$workflow_id" ]]; then
            echo "Matching artifact is not from a successful yearly-data PR check" >&2
            exit 1
          fi
          echo "mode=artifact" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download checked data artifact
        if: steps.seeds.outputs.has_seeds == 'true' && steps.artifact.outputs.mode == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .yearly-ingest-artifact
      - name: Apply checked data artifact
        if: steps.seeds.outputs.has_seeds == 'true' && steps.artifact.outputs.mode == 'artifact'
        run: >-
          python -m convert.ingest_artifact apply
          --root .yearly-ingest-artifact
          --repo-root .
          --repository "$GITHUB_REPOSITORY"
          --pr-number "${{ steps.artifact.outputs.pr_number }}"
          --pr-head-sha "${{ steps.artifact.outputs.pr_head_sha }}"
          --run-id "${{ steps.artifact.outputs.run_id }}"
          --seeds-file changed-seeds.txt
          --applied-paths-file applied-data-paths.txt
      - name: Check whether every checked year is complete
        id: catalog
        if: steps.seeds.outputs.has_seeds == 'true' && steps.artifact.outputs.mode == 'artifact'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path('.yearly-ingest-artifact/run.json').read_text(encoding='utf-8'))
          years = manifest.get('years', [])
          complete = set(manifest.get('completeYears', []))
          print(f"complete={'true' if years and set(years) <= complete else 'false'}")
          PY
      - name: Run selected annual import when no checked artifact exists
        if: steps.seeds.outputs.has_seeds == 'true' && steps.artifact.outputs.mode == 'ingest'
        shell: bash
        run: |
          while IFS= read -r seed; do
            [[ -n "$seed" ]] || continue
            python -m convert.ingest_year --seed "$seed"
          done < changed-seeds.txt
      - name: Refresh catalog from checked canonical data
        if: steps.seeds.outputs.has_seeds == 'true' && steps.artifact.outputs.mode == 'artifact' && steps.catalog.outputs.complete == 'true'
        run: >-
          python -m convert.refresh_catalog
          --data-root data
          --template metadata/school-data.template.json
          --metadata metadata/school-data.json
      - name: Commit generated yearly data
        if: steps.seeds.outputs.has_seeds == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data metadata/school-data.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "data: publish checked yearly import"
          git push origin HEAD:main

  publish-manual-pr-seed:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: python -m pip install -r crawler/requirements.txt -r convert/requirements.txt
      - name: Find a manual artifact for an unchanged seed
        id: manual
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[].filename | select(test("^data/year-links/[0-9]{4}\\.json$"))' > changed-seeds.txt
          if [[ -s changed-seeds.txt ]]; then
            echo "PR changes a seed; the main publisher handles it" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id="$(gh run list --workflow yearly-data.yml --event workflow_dispatch --commit "$PR_HEAD_SHA" \
            --json databaseId,conclusion,createdAt --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last | .databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful manual seed check matches this PR head; no data will be published" >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/yearly-data.yml" --jq '.id')"
          if [[ "$(jq -r '.event' <<<"$run_json")" != "workflow_dispatch" || \
                "$(jq -r '.conclusion' <<<"$run_json")" != "success" || \
                "$(jq -r '.head_sha' <<<"$run_json")" != "$PR_HEAD_SHA" || \
                "$(jq -r '.head_branch' <<<"$run_json")" != "$PR_HEAD_REF" || \
                "$(jq -r '.workflow_id' <<<"$run_json")" != "$workflow_id" ]]; then
            echo "Manual artifact run does not match the merged PR head" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=yearly-ingest-manual-${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
      - name: Download manually checked seed output
        if: steps.manual.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.manual.outputs.artifact_name }}
          run-id: ${{ steps.manual.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .yearly-ingest-artifact
      - name: Package and apply manual artifact
        id: manual-artifact
        if: steps.manual.outputs.publish == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ steps.manual.outputs.run_id }}
        run: |
          python - <<'PY' > changed-seeds.txt
          import json
          import re
          from pathlib import Path

          manifests = sorted(Path('.yearly-ingest-artifact').rglob('manifest.json'))
          if not manifests:
              raise SystemExit('Manual artifact contains no yearly-ingest manifest')
          for path in manifests:
              seed = json.loads(path.read_text(encoding='utf-8')).get('seedPath', '')
              if not re.fullmatch(r'data/year-links/\d{4}\.json', seed):
                  raise SystemExit(f'Invalid seed path in artifact manifest: {seed!r}')
              print(seed)
          PY
          python -m convert.ingest_artifact package --root .yearly-ingest-artifact \
            --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" \
            --pr-head-sha "$PR_HEAD_SHA" --run-id "$RUN_ID" --seeds-file changed-seeds.txt
          python -m convert.ingest_artifact apply --root .yearly-ingest-artifact --repo-root . \
            --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" \
            --pr-head-sha "$PR_HEAD_SHA" --run-id "$RUN_ID" \
            --seeds-file changed-seeds.txt --applied-paths-file applied-data-paths.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path('.yearly-ingest-artifact/run.json').read_text(encoding='utf-8'))
          years = manifest.get('years', [])
          complete = set(manifest.get('completeYears', []))
          print(f"complete={'true' if years and set(years) <= complete else 'false'}")
          PY
      - name: Refresh catalog from complete manual artifact
        if: steps.manual.outputs.publish == 'true' && steps.manual-artifact.outputs.complete == 'true'
        run: python -m convert.refresh_catalog --data-root data --template metadata/school-data.template.json --metadata metadata/school-data.json
      - name: Commit generated data for the unchanged seed
        if: steps.manual.outputs.publish == 'true'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data metadata/school-data.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "data: publish manually checked yearly import"
          git push origin "HEAD:${BASE_REF}"
